repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        # numpy pinned to match the project cap (PEP 695 stubs in numpy >= 2.5
        # break mypy under python_version = 3.10).
        additional_dependencies: ["numpy<2.3", scipy]
        args: [pyradbio]
        # Type-check the package as a whole; do not also pass changed filenames
        # (that double-counts modules under the flat layout -> "Duplicate module").
        pass_filenames: false

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: [--toml, pyproject.toml]
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://gitlab.com/schmieder.matthias/python-kacl
    rev: v0.7.3
    hooks:
      - id: kacl-verify 
