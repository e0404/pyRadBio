# Documentation site, built with Zensical (https://zensical.org): `zensical serve` to
# preview, `zensical build --strict` to build into site/. Read the Docs builds it from
# .readthedocs.yaml; CI builds it with --strict so a broken page fails the pull request.

[project]
site_name = "pyRadBio"
site_description = "Radiobiological modelling for ion-beam therapy: LEM, MKM and related models, alpha-beta tables, survival and RBE."
site_author = "Niklas Wahl"
# Zensical cannot read READTHEDOCS_CANONICAL_URL, so the canonical URL is spelled out.
site_url = "https://pyradbio.readthedocs.io/en/latest/"
repo_url = "https://github.com/e0404/pyRadBio"
repo_name = "e0404/pyRadBio"
edit_uri = "edit/develop/docs/"
copyright = "Copyright &copy; 2026 Niklas Wahl, German Cancer Research Center (DKFZ). MIT license."
docs_dir = "docs"
site_dir = "site"
# The paper digests in docs/references/ are working notes for contributors; the site
# links to them on GitHub instead of rendering them.
exclude_docs = """
references/
"""
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js",
]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quick start" = "getting-started/quickstart.md" },
  ] },
  { "User guide" = [
    { "Core concepts" = "user-guide/concepts.md" },
    { "Units and conventions" = "parameter_conventions.md" },
    { "Radiation fields and mixing" = "user-guide/fields.md" },
    { "Models" = [
      { "Overview" = "user-guide/models/index.md" },
      { "Local effect model (LEM)" = "user-guide/models/lem.md" },
      { "MKM family" = "user-guide/models/mkm.md" },
      { "Phenomenological proton RBE" = "user-guide/models/phenomenological.md" },
      { "RMF, Katz and NanOx" = "user-guide/models/other.md" },
    ] },
    { "Physics building blocks" = "user-guide/physics.md" },
    { "Tables and command line" = "user-guide/tables-cli.md" },
    { "Benchmarking against data" = "user-guide/benchmarking.md" },
    { "Examples" = "user-guide/examples.md" },
  ] },
  { "Development" = [
    { "Architecture" = "architecture.md" },
    { "Contributing" = "development/contributing.md" },
    { "Changelog" = "development/changelog.md" },
  ] },
]

[project.theme]
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true }
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.highlight = { anchor_linenums = true }
pymdownx.inlinehilite = {}
pymdownx.snippets = { base_path = ["."], check_paths = true }
pymdownx.superfences = {}
pymdownx.tabbed = { alternate_style = true }

# One reference page per public module (private _modules are skipped); the CLI is
# documented in the user guide, its argparse help text is not docstring Markdown.
[project.plugins.api-autonav]
modules = ["pyradbio"]
exclude = ["pyradbio.cli"]
nav_section_title = "API reference"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
# Lets a docstring link a name in scope as [`Name`][], the way the code refers to it.
scoped_crossrefs = true
filters = ["!^_"]
# Public API without a docstring still renders (signature, members), so it can be linked.
show_if_no_docstring = true
# Much of the public API sits on private base classes (_SpectrumMKModel, ...).
inherited_members = true
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
