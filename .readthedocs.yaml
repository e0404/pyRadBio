# Read the Docs build of the documentation site (zensical.toml), following
# https://docs.readthedocs.com/platform/stable/intro/zensical.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      - python -m pip install --upgrade pip
      - python -m pip install ".[docs]"
    build:
      html:
        # Through the interpreter: Read the Docs installs into its asdf Python,
        # whose shims do not pick up the new `zensical` console script.
        - python -m zensical build --strict
    post_build:
      # Copy the built site into the directory Read the Docs publishes.
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
