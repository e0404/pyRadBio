# Internal GitLab pipeline: code quality and coverage as GitLab-native reports.
# The full Python-version matrix, Codecov and the pyMKM job run on GitHub Actions
# (.github/workflows/ci.yml); this mirrors its fast test selection on one version.

default:
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[all]"
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  MPLBACKEND: Agg

stages: [quality, test]

code-quality:
  stage: quality
  script:
    # Report first (never fails), then the strict gates.
    - ruff check --exit-zero --output-format=gitlab --output-file=gl-code-quality-report.json .
    - ruff check .
    - ruff format --check .
    - mypy pyradbio
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

test:
  stage: test
  needs: []
  script:
    - >-
      pytest -m "not slow and not benchmark" --cov=pyradbio
      --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/^TOTAL\s+.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml
